name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false
      - name: Format check
        run: |
          gofmt -d .
          test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test -count=1 ./...
      - name: Race tests
        run: go test -race -count=1 ./...
      - name: Benchmark smoke
        run: go test -run '^$' -bench BenchmarkRateLimiterAllow -benchtime=100ms ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/sky-rate-guard .
      - name: Build container
        run: docker build -t sky-rate-guard:ci .
